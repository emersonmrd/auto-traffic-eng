! Configuração Inicial de Boot - Cisco IOS (AS 65100)
hostname Borda-Cisco
!
ip routing
!
interface Ethernet0/1
 description Link-Operadora-1
 ip address 100.64.1.2 255.255.255.252
 no shutdown
!
interface Ethernet0/2
 description Link-Operadora-2
 ip address 100.64.2.2 255.255.255.252
 no shutdown
!
interface Loopback0
 description Prefixo-ISP
 ip address 200.100.0.1 255.255.252.0
!
router bgp 65100
 bgp log-neighbor-changes
 neighbor 100.64.1.1 remote-as 65001
 neighbor 100.64.1.1 description Upstream-Operadora-1
 neighbor 100.64.2.1 remote-as 65002
 neighbor 100.64.2.1 description Upstream-Operadora-2
 !
 address-family ipv4
  network 200.100.0.0 mask 255.255.252.0
  neighbor 100.64.1.1 activate
  neighbor 100.64.1.1 send-community both
  neighbor 100.64.2.1 activate
  neighbor 100.64.2.1 send-community both
 exit-address-family
!
end
